[project]
name = "bladys"
version = "0.1.0"
description = "Modelo inicial de Blady's Pizza"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.14,<2",
    "dotenv>=0.9.9",
    "fastapi[standard]>=0.162.0",
    "hypothesis>=6.170.12",
    "pwdlib[argon2]>=0.3.1",
    "pyjwt>=2,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
