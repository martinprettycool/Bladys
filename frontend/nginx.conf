server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 6m;

    # Autenticación y catálogo
    location = /login {
        proxy_pass http://api:8000;
    }

    location = /products {
        proxy_pass http://api:8000;
    }

    # Pedidos
    location = /orders {
        proxy_pass http://api:8000;
    }

    location ^~ /orders/ {
        proxy_pass http://api:8000;
    }

    # Pagos y comprobantes
    location ^~ /payments/ {
        proxy_pass http://api:8000;
    }

    # Recepción
    location ^~ /reception/orders/ {
        proxy_pass http://api:8000;
    }

    # Cocina
    location = /kitchen/orders {
        proxy_pass http://api:8000;
    }

    location ^~ /kitchen/orders/ {
        proxy_pass http://api:8000;
    }

    # Archivos públicos del frontend
    location / {
        try_files $uri $uri/ /index.html;
    }
}
